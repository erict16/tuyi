<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <title>方案 A · 宫格</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1280px; height: 800px; overflow: hidden; font: 14px/1.4 -apple-system, "PingFang SC", sans-serif; background: #ececec; color: #1d1d1f; }
    button, input { font: inherit; }
    .win { width: 1280px; height: 800px; display: flex; flex-direction: column; background: #f5f5f7; }
    .tb { height: 44px; display: flex; align-items: center; padding: 0 16px; background: rgba(255,255,255,.72); border-bottom: 1px solid #d2d2d7; }
    .page { flex: 1; overflow: auto; padding: 28px 40px; }
    h1 { font-size: 28px; letter-spacing: -0.03em; margin: 0 0 6px; }
    .sub { color: #6e6e73; margin: 0 0 22px; font-size: 13px; }
    .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; max-width: 820px; }
    .tile {
      height: 120px; border: 0; border-radius: 16px; background: #fff;
      box-shadow: 0 1px 3px rgba(0,0,0,.06); text-align: left; padding: 16px;
      cursor: pointer;
    }
    .tile b { display: block; font-size: 16px; margin-bottom: 6px; }
    .tile span { color: #6e6e73; font-size: 12px; }
    .tile.on { outline: 2px solid #0071e3; }
    .sheet { margin-top: 22px; max-width: 560px; background: #fff; border-radius: 16px; padding: 18px 20px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
    .seg { display: flex; border: 1px solid #d2d2d7; border-radius: 8px; overflow: hidden; margin: 10px 0; }
    .seg button { flex: 1; height: 34px; border: 0; background: #fff; }
    .seg button.on { background: #0071e3; color: #fff; }
    .field { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
    .field input { flex: 1; height: 34px; border: 1px solid #d2d2d7; border-radius: 8px; padding: 0 10px; }
    .go { height: 32px; padding: 0 12px; border: 0; border-radius: 8px; background: #0071e3; color: #fff; }
  </style>
</head>
<body>
  <div class="win">
    <div class="tb"><button type="button" style="border:0;background:none">返回</button></div>
    <div class="page">
      <h1>设置</h1>
      <p class="sub">图上的字默认全译，不用选图层。点一块进去改。</p>
      <div class="tiles" id="tiles">
        <button type="button" class="tile on" data-id="tr"><b>翻译</b><span>网上或自己配接口</span></button>
        <button type="button" class="tile" data-id="wr"><b>写回</b><span>图上留什么字</span></button>
        <button type="button" class="tile" data-id="gl"><b>词汇库</b><span>固定怎么译</span></button>
        <button type="button" class="tile" data-id="th"><b>颜色</b><span>浅色 / 深色</span></button>
        <button type="button" class="tile" data-id="up"><b>更新</b><span>检查新版本</span></button>
      </div>
      <div class="sheet" id="sheet"></div>
    </div>
  </div>
  <script>
    const sheets = {
      tr: `<b>翻译</b><div class="seg"><button type="button" class="on">网上翻译</button><button type="button">自己配接口</button></div><div class="field">密钥 <input type="password" placeholder="没有就空着" /></div>`,
      wr: `<b>写回</b><div class="seg"><button type="button" class="on">只留译文</button><button type="button">原文和译文都留</button></div>`,
      gl: `<b>词汇库</b><p class="sub">图上固定怎么译的词。</p><button type="button" class="go">打开词汇库</button>`,
      th: `<b>颜色</b><div class="seg"><button type="button">浅色</button><button type="button" class="on">深色</button></div>`,
      up: `<b>更新</b><p class="sub">现在 0.1.6</p><button type="button" class="go">检查更新</button>`
    };
    const sheet = document.getElementById("sheet");
    sheet.innerHTML = sheets.tr;
    document.getElementById("tiles").onclick = (e) => {
      const t = e.target.closest(".tile");
      if (!t) return;
      document.querySelectorAll(".tile").forEach((x) => x.classList.toggle("on", x === t));
      sheet.innerHTML = sheets[t.dataset.id];
    };
  </script>
</body>
</html>
