<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <title>方案 B · 对照表</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1280px; height: 800px; overflow: hidden; font: 13px/1.4 "IBM Plex Sans", "Source Han Sans SC", sans-serif; background: #d9dde3; color: #111; }
    button, input, select { font: inherit; }
    .win { width: 1280px; height: 800px; display: flex; flex-direction: column; background: #e8eaee; }
    .tb { height: 32px; display: flex; align-items: center; padding: 0 10px; background: #cfd3d8; border-bottom: 1px solid #b4b9c0; }
    .page { flex: 1; overflow: auto; padding: 16px 20px; }
    h1 { font-size: 15px; margin: 0 0 10px; font-weight: 700; }
    table { width: 100%; max-width: 720px; border-collapse: collapse; background: #fff; border: 1px solid #b4b9c0; }
    th { text-align: left; background: #eceff2; font-size: 11px; padding: 6px 10px; border-bottom: 1px solid #b4b9c0; }
    td { padding: 8px 10px; border-bottom: 1px solid #e2e5e9; vertical-align: middle; }
    td:first-child { width: 200px; color: #333; }
    .seg { display: inline-flex; border: 1px solid #b4b9c0; }
    .seg button { height: 26px; border: 0; background: #fff; padding: 0 10px; }
    .seg button.on { background: #2f6fed; color: #fff; }
    input[type="password"], input[type="url"] { height: 26px; width: 240px; border: 1px solid #b4b9c0; padding: 0 6px; }
    .note { margin-top: 10px; font-size: 12px; color: #555; max-width: 720px; }
  </style>
</head>
<body>
  <div class="win">
    <div class="tb"><button type="button" style="border:1px solid #b4b9c0;background:#eee;height:22px">返回</button></div>
    <div class="page">
      <h1>设置</h1>
      <table>
        <thead><tr><th>项</th><th>现在</th></tr></thead>
        <tbody>
          <tr><td>怎么译</td><td><span class="seg"><button type="button" class="on">网上翻译</button><button type="button">自己配接口</button></span></td></tr>
          <tr><td>密钥</td><td><input type="password" placeholder="没有就空着" /></td></tr>
          <tr><td>写回图里</td><td><span class="seg"><button type="button" class="on">只留译文</button><button type="button">原文和译文都留</button></span></td></tr>
          <tr><td>窗口颜色</td><td><span class="seg"><button type="button">浅色</button><button type="button" class="on">深色</button></span></td></tr>
          <tr><td>词汇库</td><td><button type="button">打开</button></td></tr>
          <tr><td>更新</td><td>0.1.6　<button type="button">检查更新</button></td></tr>
        </tbody>
      </table>
      <p class="note">图上的字默认全拿来译，包括看不见的图层。没有「取字」这一栏。</p>
    </div>
  </div>
</body>
</html>
