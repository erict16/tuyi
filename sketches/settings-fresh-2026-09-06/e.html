<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <title>方案 E · 搜一下</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1280px; height: 800px; overflow: hidden; font: 13px/1.4 "SF Pro Text", "PingFang SC", sans-serif; background: #0a0a0a; color: #f2f2f2; }
    button, input { font: inherit; color: inherit; }
    .win { width: 1280px; height: 800px; display: flex; flex-direction: column; background: #111; }
    .tb { height: 36px; display: flex; align-items: center; padding: 0 12px; border-bottom: 1px solid #222; }
    .page { flex: 1; display: flex; flex-direction: column; padding: 16px 20px; }
    input[type="search"] {
      width: 100%; max-width: 640px; height: 40px; border-radius: 10px; border: 1px solid #333;
      background: #1a1a1a; padding: 0 14px; margin-bottom: 14px;
    }
    .list { max-width: 640px; border: 1px solid #2a2a2a; border-radius: 12px; overflow: hidden; background: #161616; }
    .row { display: flex; justify-content: space-between; align-items: center; padding: 11px 14px; border-top: 1px solid #2a2a2a; }
    .list .row:first-child { border-top: 0; }
    .row b { font-weight: 600; }
    .row span { color: #888; font-size: 12px; }
    .seg { display: flex; border: 1px solid #333; border-radius: 7px; overflow: hidden; }
    .seg button { height: 26px; border: 0; background: transparent; padding: 0 10px; color: #ccc; }
    .seg button.on { background: #fff; color: #111; }
    .hint { color: #666; font-size: 12px; margin: 12px 0 0; }
  </style>
</head>
<body>
  <div class="win">
    <div class="tb"><button type="button" style="border:0;background:none;color:#888">返回</button></div>
    <div class="page">
      <input type="search" id="q" placeholder="搜设置，比如 密钥、颜色、词汇库" />
      <div class="list" id="list">
        <div class="row" data-k="翻译 网上 密钥 接口"><b>怎么译</b><span class="seg"><button type="button" class="on">网上翻译</button><button type="button">自己配接口</button></span></div>
        <div class="row" data-k="密钥 deepl azure"><b>密钥</b><input type="password" placeholder="没有就空着" style="height:26px;border:1px solid #333;background:#111;padding:0 8px;width:180px" /></div>
        <div class="row" data-k="写回 译文"><b>写回图里</b><span class="seg"><button type="button" class="on">只留译文</button><button type="button">都留</button></span></div>
        <div class="row" data-k="颜色 浅色 深色"><b>窗口颜色</b><span class="seg"><button type="button">浅色</button><button type="button" class="on">深色</button></span></div>
        <div class="row" data-k="词汇库 词"><b>词汇库</b><button type="button" style="border:0;background:none;color:#8ab4ff">打开 ›</button></div>
        <div class="row" data-k="更新 版本"><b>检查更新</b><button type="button" style="border:0;background:none;color:#8ab4ff">0.1.6 ›</button></div>
      </div>
      <p class="hint">图上的字默认全译。图层、取字不出现在这里。</p>
    </div>
  </div>
  <script>
    const q = document.getElementById("q");
    q.oninput = () => {
      const v = q.value.trim();
      document.querySelectorAll(".row").forEach((r) => {
        r.style.display = !v || r.dataset.k.indexOf(v) >= 0 || r.innerText.indexOf(v) >= 0 ? "" : "none";
      });
    };
  </script>
</body>
</html>
