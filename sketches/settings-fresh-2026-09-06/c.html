<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <title>方案 C · 三步</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1280px; height: 800px; overflow: hidden; font: 15px/1.45 "PingFang SC", sans-serif; background: #0b1220; color: #eef3ff; }
    button, input { font: inherit; color: inherit; }
    .win { width: 1280px; height: 800px; display: flex; flex-direction: column; background: #10192c; }
    .tb { height: 40px; display: flex; align-items: center; padding: 0 16px; border-bottom: 1px solid #24324a; }
    .page { flex: 1; display: grid; place-items: center; }
    .card { width: 520px; background: #18233a; border: 1px solid #2a3b58; border-radius: 18px; padding: 28px; }
    .steps { display: flex; gap: 8px; margin-bottom: 18px; color: #8ea0bd; font-size: 12px; }
    .steps b { color: #6db3ff; }
    h1 { margin: 0 0 8px; font-size: 24px; letter-spacing: -0.03em; }
    p { margin: 0 0 16px; color: #8ea0bd; font-size: 13px; }
    .choice { display: block; width: 100%; text-align: left; margin-bottom: 8px; padding: 12px 14px; border-radius: 12px; border: 1px solid #2a3b58; background: #121b2e; }
    .choice.on { border-color: #6db3ff; background: #1b2c4a; }
    .field { display: flex; gap: 8px; margin: 12px 0 18px; }
    .field input { flex: 1; height: 36px; border-radius: 10px; border: 1px solid #2a3b58; background: #121b2e; padding: 0 10px; }
    .nav { display: flex; justify-content: space-between; }
    .nav button { height: 36px; padding: 0 16px; border-radius: 10px; border: 0; }
    .next { background: #6db3ff; color: #081018; font-weight: 700; }
    .back { background: transparent; color: #8ea0bd; }
  </style>
</head>
<body>
  <div class="win">
    <div class="tb"><button type="button" style="border:0;background:none;color:#8ea0bd">返回</button></div>
    <div class="page">
      <div class="card" id="card"></div>
    </div>
  </div>
  <script>
    const steps = [
      { n: "1 / 3", h: "字送到哪去译？", p: "图上的字默认全译，不用选图层。",
        body: `<button type="button" class="choice on">网上翻译</button><button type="button" class="choice">自己配接口</button><div class="field"><input type="password" placeholder="密钥，没有就空着" /></div>` },
      { n: "2 / 3", h: "写回图里留什么？", p: "译完落回 CAD 时。",
        body: `<button type="button" class="choice on">只留译文</button><button type="button" class="choice">原文和译文都留</button>` },
      { n: "3 / 3", h: "颜色和更新", p: "改完就能干活了。",
        body: `<button type="button" class="choice">浅色</button><button type="button" class="choice on">深色</button>
          <div style="display:flex;gap:8px;margin-top:12px"><button type="button" class="next">打开词汇库</button><button type="button" class="next">检查更新</button></div>` }
    ];
    let i = 0;
    const card = document.getElementById("card");
    function draw() {
      const s = steps[i];
      card.innerHTML = `<div class="steps">${steps.map((x, k) => k === i ? `<b>${x.n}</b>` : `<span>${x.n}</span>`).join(" · ")}</div>
        <h1>${s.h}</h1><p>${s.p}</p>${s.body}
        <div class="nav"><button type="button" class="back" id="b">${i ? "上一步" : " "}</button>
        <button type="button" class="next" id="n">${i === 2 ? "完成" : "下一步"}</button></div>`;
      card.querySelectorAll(".choice").forEach((c) => c.onclick = () => {
        c.parentElement.querySelectorAll(".choice").forEach((x) => x.classList.remove("on"));
        c.classList.add("on");
      });
      document.getElementById("b").onclick = () => { if (i) { i--; draw(); } };
      document.getElementById("n").onclick = () => { if (i < 2) { i++; draw(); } };
    }
    draw();
  </script>
</body>
</html>
