<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <title>方案 C · 小窗</title>
  <link rel="stylesheet" href="_win.css" />
  <style>
    .body { flex: 1; position: relative; }
    .dim { position: absolute; inset: 0; background: rgba(20,32,51,.35); display: grid; place-items: center; }
    .dlg {
      width: 480px; background: var(--elev); border-radius: 12px;
      box-shadow: 0 18px 50px rgba(20,40,80,.2); padding: 18px 20px 16px;
    }
    .dlg h1 { font-size: 18px; }
    .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="win">
    <div class="titlebar"><div class="lights" aria-hidden="true"><i class="r"></i><i class="y"></i><i class="g"></i></div><b>图译</b><span></span></div>
    <header class="tb"><button type="button" class="tbtn">打开图纸</button><span class="grow"></span><button type="button" class="tbtn">词汇库</button><button type="button" class="tbtn">设置</button></header>
    <div class="body">
      <div class="dim">
        <div class="dlg">
          <h1>设置</h1>
          <p class="help">小窗，改完关掉。图上的字默认全译。</p>
          <div class="seg"><button type="button" class="on">网上翻译</button><button type="button">自己配接口</button></div>
          <div class="field">密钥 <input type="password" placeholder="没有就空着" /></div>
          <div class="seg"><button type="button" class="on">只留译文</button><button type="button">原文和译文都留</button></div>
          <div class="seg"><button type="button">浅色</button><button type="button" class="on">深色</button></div>
          <div class="field"><button type="button" class="tbtn">检查更新</button></div>
          <div class="actions">
            <button type="button" class="tbtn">取消</button>
            <button type="button" class="tbtn pri">好</button>
          </div>
        </div>
      </div>
    </div>
    <footer class="foot"><span class="live">ODA 已装</span></footer>
  </div>
</body>
</html>
