<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <title>E · 表格进出</title>
  <link rel="stylesheet" href="_win.css" />
  <style>
    .hero {
      flex: none;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 8px 18px 12px;
    }
    .drop {
      min-height: 92px;
      display: grid;
      place-items: center;
      text-align: center;
      border: 1.5px dashed #b7c5d8;
      border-radius: 12px;
      background: var(--elev);
      padding: 12px;
    }
    .drop h2 { margin: 0 0 4px; font-size: 14px; }
    .drop p { margin: 0; color: var(--muted); font-size: 12px; }
    .drop.out { border-style: solid; }
    .table-wrap {
      flex: 1; min-height: 0; overflow: auto;
      margin: 0 18px 12px; border: 1px solid var(--border);
      border-radius: 10px; background: var(--elev);
    }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 7px 12px; text-align: left; border-bottom: 1px solid var(--border); }
    th { position: sticky; top: 0; background: var(--elev); color: var(--muted); font-size: 11px; }
    td input { width: 100%; border: 0; background: transparent; }
  </style>
</head>
<body>
  <div class="win" role="application" aria-label="图译">
    <div class="titlebar">
      <div class="lights" aria-hidden="true"><i class="r"></i><i class="y"></i><i class="g"></i></div>
      <b>图译</b><span></span>
    </div>
    <header class="tb">
      <button type="button" class="tbtn">返回</button>
      <span class="grow"></span>
      <button type="button" class="tbtn pri">加上一条</button>
    </header>
    <div class="page">
      <div class="head">
        <h1>我定的译法</h1>
        <p>词多了就用表格进出。Excel、CSV 都行。一列中文，一列英文。</p>
      </div>
      <div class="hero">
        <label class="drop">
          <div>
            <h2>把表格拖进来</h2>
            <p>会换成你这份。软件自带的不动。</p>
          </div>
          <input type="file" accept=".csv,.xlsx,.xls" hidden />
        </label>
        <button type="button" class="drop out">
          <div>
            <h2>导出成表格</h2>
            <p>只导出我定的这 3 条。</p>
          </div>
        </button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>图上的中文</th><th>要写成</th><th style="width:90px">谁定的</th><th style="width:52px"></th></tr>
          </thead>
          <tbody>
            <tr><td><input value="电气原理图" /></td><td><input value="Electrical Schematic" /></td><td>我定的</td><td><button type="button" class="del">删掉</button></td></tr>
            <tr><td><input value="接地" /></td><td><input value="Earthing" /></td><td>我定的</td><td><button type="button" class="del">删掉</button></td></tr>
            <tr><td><input value="进线柜" /></td><td><input value="Incoming Cabinet" /></td><td>我定的</td><td><button type="button" class="del">删掉</button></td></tr>
            <tr class="locked"><td><input value="变压器" readonly /></td><td><input value="Transformer" readonly /></td><td><span class="tag">软件自带</span></td><td></td></tr>
            <tr class="locked"><td><input value="断路器" readonly /></td><td><input value="Circuit Breaker" readonly /></td><td><span class="tag">软件自带</span></td><td></td></tr>
          </tbody>
        </table>
      </div>
    </div>
    <footer class="foot">导入只改我定的。软件自带那 393 条不会被盖掉。</footer>
  </div>
</body>
</html>
