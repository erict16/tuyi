<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <title>D · 卡片</title>
  <link rel="stylesheet" href="_win.css" />
  <style>
    .board {
      flex: 1; min-height: 0; overflow: auto;
      padding: 4px 18px 18px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      align-content: start;
    }
    .card {
      background: var(--elev);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px 10px;
      min-height: 108px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .card.locked { background: var(--soft); }
    .card .zh { font-size: 15px; font-weight: 650; }
    .card .en { font-size: 13px; color: var(--muted); }
    .card .bar { margin-top: auto; display: flex; justify-content: space-between; align-items: center; }
    .composer {
      grid-column: 1 / -1;
      display: flex; gap: 8px; align-items: center;
      padding: 10px 12px;
      background: var(--elev);
      border: 1.5px dashed var(--border);
      border-radius: 12px;
    }
    .composer input {
      flex: 1; height: 32px; border: 1px solid var(--border);
      border-radius: 8px; background: var(--bg); padding: 0 10px;
    }
  </style>
</head>
<body>
  <div class="win" role="application" aria-label="图译">
    <div class="titlebar">
      <div class="lights" aria-hidden="true"><i class="r"></i><i class="y"></i><i class="g"></i></div>
      <b>图译</b><span></span>
    </div>
    <header class="tb">
      <button type="button" class="tbtn">返回</button>
      <span class="grow"></span>
      <input class="search" type="search" placeholder="搜一下…" aria-label="搜" />
    </header>
    <div class="page">
      <div class="head">
        <h1>我定的译法</h1>
        <p>一条一张卡片。软件自带的是灰的，动不了。</p>
      </div>
      <div class="board" id="board">
        <form class="composer" id="form">
          <input placeholder="图上的中文" id="zh" required />
          <input placeholder="要写成" id="en" required />
          <button type="submit" class="tbtn pri">加上</button>
        </form>
        <article class="card">
          <div class="zh">电气原理图</div>
          <div class="en">Electrical Schematic</div>
          <div class="bar"><span class="tag">我定的</span><button type="button" class="del">删掉</button></div>
        </article>
        <article class="card">
          <div class="zh">接地</div>
          <div class="en">Earthing</div>
          <div class="bar"><span class="tag">我定的</span><button type="button" class="del">删掉</button></div>
        </article>
        <article class="card">
          <div class="zh">进线柜</div>
          <div class="en">Incoming Cabinet</div>
          <div class="bar"><span class="tag">我定的</span><button type="button" class="del">删掉</button></div>
        </article>
        <article class="card locked">
          <div class="zh">变压器</div>
          <div class="en">Transformer</div>
          <div class="bar"><span class="tag">软件自带</span></div>
        </article>
        <article class="card locked">
          <div class="zh">断路器</div>
          <div class="en">Circuit Breaker</div>
          <div class="bar"><span class="tag">软件自带</span></div>
        </article>
        <article class="card locked">
          <div class="zh">母线</div>
          <div class="en">Busbar</div>
          <div class="bar"><span class="tag">软件自带</span></div>
        </article>
        <article class="card locked">
          <div class="zh">电缆</div>
          <div class="en">Cable</div>
          <div class="bar"><span class="tag">软件自带</span></div>
        </article>
        <article class="card locked">
          <div class="zh">开关柜</div>
          <div class="en">Switchgear</div>
          <div class="bar"><span class="tag">软件自带</span></div>
        </article>
      </div>
    </div>
    <footer class="foot">卡片适合条数不多的时候翻。词上百条还是用表。</footer>
  </div>
  <script>
    const board = document.getElementById("board");
    document.getElementById("form").onsubmit = function (e) {
      e.preventDefault();
      const zh = document.getElementById("zh"), en = document.getElementById("en");
      const art = document.createElement("article");
      art.className = "card row-enter";
      art.innerHTML = "<div class=\"zh\">" + zh.value + "</div><div class=\"en\">" + en.value + "</div><div class=\"bar\"><span class=\"tag\">我定的</span><button type=\"button\" class=\"del\">删掉</button></div>";
      board.insertBefore(art, board.children[1]);
      zh.value = ""; en.value = "";
    };
    board.addEventListener("click", function (e) {
      if (e.target.classList.contains("del")) e.target.closest(".card").remove();
    });
  </script>
</body>
</html>
