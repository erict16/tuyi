<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <title>现状 · 塞在设置里</title>
  <link rel="stylesheet" href="_win.css" />
  <style>
    .page { overflow: auto; padding: 16px 22px 28px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .card {
      background: var(--elev);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 14px 12px;
      opacity: .42;
    }
    .card.mine { grid-column: 1 / -1; opacity: 1; box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 35%, transparent); }
    .card h2 { margin: 6px 0 4px; font-size: 11px; font-weight: 650; color: var(--muted); }
    .card p { margin: 0 0 8px; font-size: 12px; color: var(--muted); }
    .term { display: grid; grid-template-columns: 1fr 1fr auto; gap: 6px; padding: 4px 0; }
    .term input {
      height: 26px; border: 1px solid var(--border); border-radius: 6px;
      background: var(--soft); padding: 0 8px;
    }
    .note {
      margin: 0 0 12px;
      padding: 8px 10px;
      border-radius: 8px;
      background: color-mix(in srgb, var(--accent) 10%, var(--elev));
      border: 1px solid color-mix(in srgb, var(--accent) 28%, var(--border));
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="win" role="application" aria-label="图译">
    <div class="titlebar">
      <div class="lights" aria-hidden="true"><i class="r"></i><i class="y"></i><i class="g"></i></div>
      <b>图译</b><span></span>
    </div>
    <header class="tb">
      <button type="button" class="tbtn">返回</button>
      <span class="grow"></span>
    </header>
    <div class="page">
      <div class="head">
        <h1>设置</h1>
        <p>现在「我的术语」塞在最底下。</p>
      </div>
      <p class="note">词多了要往下翻。软件自带的 393 条还不在这儿，只看得到你自己加的两三条。</p>
      <div class="grid">
        <div class="card"><h2>用哪里翻译</h2><p>网上 / 这台电脑 / 自己的接口</p></div>
        <div class="card"><h2>图纸上怎么写</h2><p>只留译文 / 原文和译文都留</p></div>
        <div class="card"><h2>不译这些</h2><p>数字、尺寸 · 重复的句子</p></div>
        <div class="card"><h2>图层</h2><p>冻结 / 锁住 / 关掉</p></div>
        <div class="card mine">
          <h2>我的术语</h2>
          <p>内置词不能改。这里是你自己的对应。</p>
          <div class="term">
            <input value="电气原理图" aria-label="图上的中文" />
            <input value="Electrical Schematic" aria-label="要写成" />
            <button type="button" class="tbtn">删</button>
          </div>
          <div class="term">
            <input value="接地" aria-label="图上的中文" />
            <input value="Earthing" aria-label="要写成" />
            <button type="button" class="tbtn">删</button>
          </div>
          <div class="term">
            <input placeholder="新原文…" aria-label="新中文" />
            <input placeholder="新译文…" aria-label="新英文" />
            <button type="button" class="tbtn pri">加</button>
          </div>
        </div>
      </div>
    </div>
    <footer class="foot"><span>设置最底下这一块，就是现在的术语。</span></footer>
  </div>
</body>
</html>
