<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <title>C · 点开再改</title>
  <link rel="stylesheet" href="_win.css" />
  <style>
    .split { flex: 1; min-height: 0; display: grid; grid-template-columns: 280px 1fr; }
    .list {
      min-height: 0; overflow: auto;
      border-right: 1px solid var(--border); background: var(--elev);
    }
    .item {
      display: flex; justify-content: space-between; gap: 8px;
      width: 100%; text-align: left;
      padding: 9px 14px; border-bottom: 1px solid var(--border);
    }
    .item:hover { background: var(--soft); }
    .item.on { background: color-mix(in srgb, var(--accent) 12%, var(--elev)); }
    .item b { font-weight: 650; }
    .item span { color: var(--muted); font-size: 12px; }
    .detail { padding: 22px 28px; overflow: auto; }
    .detail h2 { margin: 0 0 6px; font-size: 20px; letter-spacing: -0.03em; }
    .detail .who { color: var(--muted); font-size: 12px; margin-bottom: 18px; }
    .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
    .field label { font-size: 12px; font-weight: 650; color: var(--muted); }
    .field input, .field textarea {
      height: 36px; border: 1px solid var(--border); border-radius: 8px;
      background: var(--elev); padding: 0 10px; font-size: 14px;
    }
    .field textarea { height: 72px; padding: 8px 10px; resize: none; }
    .actions { display: flex; gap: 8px; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="win" role="application" aria-label="图译">
    <div class="titlebar">
      <div class="lights" aria-hidden="true"><i class="r"></i><i class="y"></i><i class="g"></i></div>
      <b>图译</b><span></span>
    </div>
    <header class="tb">
      <button type="button" class="tbtn">返回</button>
      <input class="search" type="search" placeholder="搜一下…" aria-label="搜" style="margin-left:8px" />
      <span class="grow"></span>
      <button type="button" class="tbtn pri" id="new">新加一条</button>
    </header>
    <div class="page">
      <div class="split">
        <div class="list" id="list">
          <button type="button" class="item on" data-zh="电气原理图" data-en="Electrical Schematic" data-who="mine"><b>电气原理图</b><span>我定的</span></button>
          <button type="button" class="item" data-zh="接地" data-en="Earthing" data-who="mine"><b>接地</b><span>我定的</span></button>
          <button type="button" class="item" data-zh="进线柜" data-en="Incoming Cabinet" data-who="mine"><b>进线柜</b><span>我定的</span></button>
          <button type="button" class="item" data-zh="变压器" data-en="Transformer" data-who="lock"><b>变压器</b><span>软件自带</span></button>
          <button type="button" class="item" data-zh="断路器" data-en="Circuit Breaker" data-who="lock"><b>断路器</b><span>软件自带</span></button>
          <button type="button" class="item" data-zh="母线" data-en="Busbar" data-who="lock"><b>母线</b><span>软件自带</span></button>
          <button type="button" class="item" data-zh="电缆" data-en="Cable" data-who="lock"><b>电缆</b><span>软件自带</span></button>
        </div>
        <div class="detail">
          <h2 id="title">电气原理图</h2>
          <p class="who" id="who">我定的。可以改。</p>
          <div class="field">
            <label for="zh">图上的中文</label>
            <input id="zh" value="电气原理图" />
          </div>
          <div class="field">
            <label for="en">要写成</label>
            <input id="en" value="Electrical Schematic" />
          </div>
          <div class="actions">
            <button type="button" class="tbtn pri" id="save">记下</button>
            <button type="button" class="tbtn ghost" id="del">删掉这条</button>
          </div>
        </div>
      </div>
    </div>
    <footer class="foot">左边点一条，右边改。软件自带的点开只能看。</footer>
  </div>
  <script>
    const zh = document.getElementById("zh");
    const en = document.getElementById("en");
    const who = document.getElementById("who");
    const title = document.getElementById("title");
    const del = document.getElementById("del");
    document.getElementById("list").addEventListener("click", function (e) {
      const item = e.target.closest(".item");
      if (!item) return;
      document.querySelectorAll(".item").forEach(function (i) { i.classList.toggle("on", i === item); });
      zh.value = item.dataset.zh;
      en.value = item.dataset.en;
      title.textContent = item.dataset.zh;
      const lock = item.dataset.who === "lock";
      zh.readOnly = en.readOnly = lock;
      who.textContent = lock ? "软件自带。改不了。" : "我定的。可以改。";
      del.style.display = lock ? "none" : "";
    });
  </script>
</body>
</html>
