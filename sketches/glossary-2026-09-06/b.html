<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <title>B · 左右分开</title>
  <link rel="stylesheet" href="_win.css" />
  <style>
    .split { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; }
    .pane {
      min-height: 0; overflow: auto; padding: 8px 14px 16px;
      border-right: 1px solid var(--border);
    }
    .pane:last-child { border-right: 0; background: var(--soft); }
    .pane h2 { margin: 8px 4px 10px; font-size: 13px; font-weight: 650; }
    .pane h2 span { font-weight: 500; color: var(--muted); font-size: 12px; }
    .pair {
      display: grid; grid-template-columns: 1fr 1fr auto;
      gap: 6px; align-items: center;
      padding: 8px 10px; margin-bottom: 6px;
      background: var(--elev); border: 1px solid var(--border); border-radius: 8px;
    }
    .pair input { border: 0; background: transparent; min-width: 0; }
    .pair input:focus { outline: 1.5px solid var(--accent); border-radius: 3px; }
    .pair.locked { background: transparent; }
  </style>
</head>
<body>
  <div class="win" role="application" aria-label="图译">
    <div class="titlebar">
      <div class="lights" aria-hidden="true"><i class="r"></i><i class="y"></i><i class="g"></i></div>
      <b>图译</b><span></span>
    </div>
    <header class="tb">
      <button type="button" class="tbtn">返回</button>
      <span class="grow"></span>
    </header>
    <div class="page">
      <div class="head">
        <h1>我定的译法</h1>
        <p>左边你能改。右边是软件自带的，只能看。</p>
      </div>
      <div class="split">
        <div class="pane">
          <h2>我定的 <span>3 条 · 碰上了用这边</span></h2>
          <div class="add" style="margin:0 0 10px">
            <input placeholder="图上的中文" id="zh" />
            <input placeholder="要写成" id="en" />
            <button type="button" class="tbtn pri" id="add">加上</button>
          </div>
          <div id="mine">
            <div class="pair row-enter"><input value="电气原理图" /><input value="Electrical Schematic" /><button type="button" class="del">删掉</button></div>
            <div class="pair"><input value="接地" /><input value="Earthing" /><button type="button" class="del">删掉</button></div>
            <div class="pair"><input value="进线柜" /><input value="Incoming Cabinet" /><button type="button" class="del">删掉</button></div>
          </div>
        </div>
        <div class="pane">
          <h2>软件自带 <span>393 条 · 改不了</span></h2>
          <input class="search" type="search" placeholder="在自带词里搜…" aria-label="搜自带" style="width:100%;margin-bottom:10px" />
          <div class="pair locked"><input value="变压器" readonly /><input value="Transformer" readonly /><span class="tag">自带</span></div>
          <div class="pair locked"><input value="断路器" readonly /><input value="Circuit Breaker" readonly /><span class="tag">自带</span></div>
          <div class="pair locked"><input value="母线" readonly /><input value="Busbar" readonly /><span class="tag">自带</span></div>
          <div class="pair locked"><input value="电缆" readonly /><input value="Cable" readonly /><span class="tag">自带</span></div>
          <div class="pair locked"><input value="开关柜" readonly /><input value="Switchgear" readonly /><span class="tag">自带</span></div>
          <div class="pair locked"><input value="接地极" readonly /><input value="Earth Electrode" readonly /><span class="tag">自带</span></div>
        </div>
      </div>
    </div>
    <footer class="foot">同一句中文两边都有时，用我定的。</footer>
  </div>
  <script>
    const mine = document.getElementById("mine");
    document.getElementById("add").onclick = function () {
      const zh = document.getElementById("zh"), en = document.getElementById("en");
      if (!zh.value.trim() || !en.value.trim()) return;
      const el = document.createElement("div");
      el.className = "pair row-enter";
      el.innerHTML = "<input value=\"" + zh.value.replace(/"/g,"") + "\" /><input value=\"" + en.value.replace(/"/g,"") + "\" /><button type=\"button\" class=\"del\">删掉</button>";
      mine.prepend(el);
      zh.value = ""; en.value = "";
    };
    mine.addEventListener("click", function (e) {
      if (e.target.classList.contains("del")) e.target.closest(".pair").remove();
    });
  </script>
</body>
</html>
