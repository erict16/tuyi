<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <title>D · 一条线</title>
  <link rel="stylesheet" href="_set.css" />
</head>
<body>
  <div class="win">
    <div class="titlebar"><div class="lights" aria-hidden="true"><i class="r"></i><i class="y"></i><i class="g"></i></div><b>图译</b><span></span></div>
    <header class="tb"><button type="button" class="tbtn">返回</button><span class="grow"></span></header>
    <section class="set-page">
      <div class="set-h"><h1>设置</h1><p>从上往下看完。</p></div>
      <div class="stack">
        <div class="card">
          <h2>1. 怎么译</h2>
          <label class="row"><input type="radio" name="e" checked /> 网上翻译</label>
          <label class="row"><input type="radio" name="e" /> 自己配接口</label>
          <div class="field">密钥 <input type="password" placeholder="没有就空着" /></div>
        </div>
        <div class="card">
          <h2>2. 写回图里留什么</h2>
          <label class="row"><input type="radio" name="l" checked /> 只留译文</label>
          <label class="row"><input type="radio" name="l" /> 原文和译文都留</label>
        </div>
        <div class="card">
          <h2>3. 窗口颜色</h2>
          <div class="seg">
            <button type="button">浅色</button>
            <button type="button" class="on">深色</button>
          </div>
        </div>
        <div class="card">
          <h2>4. 更新</h2>
          <div class="field"><button type="button" class="tbtn">检查更新</button><span>现在 0.1.6</span></div>
        </div>
        <details class="block">
          <summary>少用的</summary>
          <p class="help">不联网、图层、从哪拿字。</p>
          <label class="row"><input type="checkbox" /> 不联网（本机 Ollama）</label>
          <label class="row"><input type="checkbox" checked /> 数字、尺寸先别译</label>
          <label class="row"><input type="checkbox" /> 冻住的图层也译</label>
          <label class="row"><input type="checkbox" /> 文件名也译</label>
        </details>
      </div>
    </section>
    <footer class="foot"><span class="live">ODA 已装</span></footer>
  </div>
</body>
</html>
