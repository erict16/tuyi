<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <title>B · 一排排</title>
  <link rel="stylesheet" href="_set.css" />
</head>
<body>
  <div class="win">
    <div class="titlebar"><div class="lights" aria-hidden="true"><i class="r"></i><i class="y"></i><i class="g"></i></div><b>图译</b><span></span></div>
    <header class="tb"><button type="button" class="tbtn">返回</button><span class="grow"></span></header>
    <section class="set-page">
      <div class="set-h"><h1>设置</h1><p>跟手机设置一样，一行一件事。</p></div>
      <div class="list">
        <h3>翻译</h3>
        <button type="button" class="li">怎么译 <span class="val">网上翻译 ›</span></button>
        <div class="li">密钥 <input type="password" placeholder="没有就空着" style="width:180px;height:28px;border:1px solid var(--border);border-radius:6px;background:var(--soft);padding:0 8px" /></div>
      </div>
      <div class="list">
        <h3>图纸</h3>
        <button type="button" class="li">写回图里 <span class="val">只留译文 ›</span></button>
      </div>
      <div class="list">
        <h3>窗口</h3>
        <div class="li">深色 <span class="sw on" aria-hidden="true"><i></i></span></div>
        <button type="button" class="li">检查更新 <span class="val">0.1.6 ›</span></button>
      </div>
      <div class="list">
        <h3>少用的</h3>
        <button type="button" class="li">不联网、图层、取字 <span class="val">›</span></button>
      </div>
    </section>
    <footer class="foot"><span class="live">ODA 已装</span></footer>
  </div>
</body>
</html>
