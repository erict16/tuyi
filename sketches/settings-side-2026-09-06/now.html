<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <title>现状 · 左侧目录</title>
  <link rel="stylesheet" href="_set.css" />
</head>
<body>
  <div class="win">
    <div class="titlebar"><div class="lights" aria-hidden="true"><i class="r"></i><i class="y"></i><i class="g"></i></div><b>图译</b><span></span></div>
    <header class="tb"><button type="button" class="tbtn">返回</button><span class="grow"></span></header>
    <div class="split">
      <nav class="side">
        <button type="button" class="on" data-id="tr">翻译</button>
        <button type="button" data-id="wr">写回</button>
        <button type="button" data-id="tx">取字</button>
        <button type="button" data-id="th">颜色</button>
        <button type="button" data-id="up">更新</button>
      </nav>
      <div class="pane">
        <div class="set-h"><h1>翻译</h1><p>字送到哪去译。</p></div>
        <div class="card" style="max-width:520px">
          <p class="help">网上翻译用 DeepL 或 Azure，要密钥。自己配接口就填网址和密钥。不联网要先打开 Ollama。</p>
          <label class="row"><input type="radio" name="e" checked /> 网上翻译</label>
          <label class="row"><input type="radio" name="e" /> 自己配接口</label>
          <label class="row"><input type="radio" name="e" /> 不联网（本机 Ollama）</label>
          <div class="field">密钥 <input type="password" placeholder="没有就空着" /></div>
        </div>
      </div>
    </div>
    <footer class="foot"><span class="live">ODA 已装</span></footer>
  </div>
  <script src="_nav.js"></script>
  <script>
    settingsNav({
      tr: document.querySelector(".pane").innerHTML,
      wr: `<div class="set-h"><h1>写回</h1><p>译完写回图里，留什么字。</p></div><div class="card" style="max-width:520px"><label class="row"><input type="radio" name="l" checked /> 只留译文</label><label class="row"><input type="radio" name="l" /> 原文和译文都留</label></div>`,
      tx: `<div class="set-h"><h1>取字</h1><p>从图上哪拿字。看不见的图层默认不译。</p></div><div class="card" style="max-width:520px"><label class="row"><input type="checkbox" checked /> 块上的属性</label><label class="row"><input type="checkbox" /> 块里面的字</label><label class="row"><input type="checkbox" checked /> 标注和表格</label><label class="row"><input type="checkbox" /> 冻住的（看不见）也译</label></div>`,
      th: `<div class="set-h"><h1>颜色</h1><p>只改这个窗口。</p></div><div class="card" style="max-width:520px"><label class="row"><input type="radio" name="t" /> 浅色</label><label class="row"><input type="radio" name="t" checked /> 深色</label></div>`,
      up: `<div class="set-h"><h1>更新</h1><p>图译 0.1.6</p></div><div class="card" style="max-width:520px"><button type="button" class="tbtn">检查更新</button></div>`
    });
  </script>
</body>
</html>
