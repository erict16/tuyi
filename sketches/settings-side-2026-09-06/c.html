<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <title>方案 C · 密钥跟着选</title>
  <link rel="stylesheet" href="_set.css" />
</head>
<body>
  <div class="win">
    <div class="titlebar"><div class="lights" aria-hidden="true"><i class="r"></i><i class="y"></i><i class="g"></i></div><b>图译</b><span></span></div>
    <header class="tb"><button type="button" class="tbtn">返回</button><span class="grow"></span></header>
    <div class="split">
      <nav class="side">
        <button type="button" class="on" data-id="tr">翻译</button>
        <button type="button" data-id="wr">写回</button>
        <button type="button" data-id="gl">词汇库</button>
        <button type="button" data-id="th">颜色</button>
        <button type="button" data-id="up">更新</button>
      </nav>
      <div class="pane" id="pane"></div>
    </div>
    <footer class="foot"><span class="live">ODA 已装</span></footer>
  </div>
  <script src="_nav.js"></script>
  <script>
    const tr = `<div class="set-h"><h1>翻译</h1><p>选网上才出密钥。选自己配才出网址。</p></div>
      <div class="card" style="max-width:520px">
        <div class="seg" id="eng">
          <button type="button" class="on" data-e="net">网上翻译</button>
          <button type="button" data-e="own">自己配接口</button>
        </div>
        <div id="net"><p class="cap">DeepL 或 Azure。</p>
          <div class="seg" style="max-width:240px"><button type="button" class="on">DeepL</button><button type="button">Azure</button></div>
          <div class="field">密钥 <input type="password" placeholder="没有就空着" /></div></div>
        <div id="own" hidden><p class="cap">填网址和密钥，比如 DeepSeek。</p>
          <div class="field">网址 <input type="url" placeholder="https://" /></div>
          <div class="field">密钥 <input type="password" placeholder="没有就空着" /></div></div>
      </div>`;
    settingsNav({
      tr,
      wr: `<div class="set-h"><h1>写回</h1><p>图上最后留什么。</p></div><div class="card" style="max-width:520px"><div class="seg"><button type="button" class="on">只留译文</button><button type="button">原文和译文都留</button></div></div>`,
      gl: `<div class="set-h"><h1>词汇库</h1><p>固定怎么译的词。</p></div><div class="card" style="max-width:520px"><button type="button" class="tbtn pri">打开词汇库</button></div>`,
      th: `<div class="set-h"><h1>颜色</h1></div><div class="card" style="max-width:520px"><div class="seg"><button type="button">浅色</button><button type="button" class="on">深色</button></div></div>`,
      up: `<div class="set-h"><h1>更新</h1><p>现在 0.1.6</p></div><div class="card" style="max-width:520px"><button type="button" class="tbtn">检查更新</button></div>`
    });
    document.querySelector(".pane").innerHTML = tr;
    document.querySelector(".pane").addEventListener("click", (e) => {
      const btn = e.target.closest("#eng button");
      if (!btn) return;
      document.querySelectorAll("#eng button").forEach((b) => b.classList.toggle("on", b === btn));
      const net = document.getElementById("net");
      const own = document.getElementById("own");
      if (net && own) { net.hidden = btn.dataset.e !== "net"; own.hidden = btn.dataset.e !== "own"; }
    });
  </script>
</body>
</html>
