<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>设置 · 从分段按钮接着</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, "PingFang SC", sans-serif;
      background: #111; color: #ececec;
      display: grid; grid-template-rows: auto 1fr;
    }
    header {
      padding: .7rem 1rem .65rem;
      border-bottom: 1px solid rgba(255,255,255,.08);
      display: flex; flex-wrap: wrap; gap: .55rem 1rem;
      justify-content: space-between; align-items: center;
    }
    h1 { font-size: .92rem; font-weight: 600; }
    .hint { font-size: .72rem; color: #8b8f98; margin-top: .15rem; }
    .tabs { display: flex; flex-wrap: wrap; gap: .3rem; }
    .tabs button {
      border: 1px solid rgba(255,255,255,.1);
      background: rgba(255,255,255,.04);
      color: #b8bcc4; font: inherit; font-size: .72rem;
      padding: .38rem .7rem; border-radius: 999px; cursor: pointer;
    }
    .tabs button[aria-selected="true"] { background: #fff; color: #111; font-weight: 600; }
    iframe { width: 100%; height: 100%; border: 0; background: #e8eef4; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>设置 · 从分段按钮接着</h1>
      <p class="hint">顶栏切档，按 1–6。1 是方案6。「我定的译法」已改成词汇库。软件设置页还没换版式。</p>
    </div>
    <div class="tabs" role="tablist" aria-label="方案">
      <button type="button" role="tab" aria-selected="true" data-src="now.html" data-key="1">方案6</button>
      <button type="button" role="tab" aria-selected="false" data-src="a.html" data-key="2">大分段</button>
      <button type="button" role="tab" aria-selected="false" data-src="b.html" data-key="3">密钥跟着选</button>
      <button type="button" role="tab" aria-selected="false" data-src="c.html" data-key="4">词汇库上台</button>
      <button type="button" role="tab" aria-selected="false" data-src="d.html" data-key="5">一张卡拨完</button>
      <button type="button" role="tab" aria-selected="false" data-src="e.html" data-key="6">带一句说明</button>
    </div>
  </header>
  <iframe id="frame" src="now.html" title="方案预览"></iframe>
  <script>
    const frame = document.getElementById("frame");
    const tabs = [...document.querySelectorAll(".tabs button")];
    function pick(btn) {
      tabs.forEach((b) => b.setAttribute("aria-selected", b === btn ? "true" : "false"));
      frame.src = btn.dataset.src;
    }
    tabs.forEach((btn) => btn.addEventListener("click", () => pick(btn)));
    document.addEventListener("keydown", (e) => {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      const btn = tabs.find((b) => b.dataset.key === e.key);
      if (btn) { e.preventDefault(); pick(btn); }
    });
  </script>
</body>
</html>
