<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <title>E · 分段带一句说明</title>
  <link rel="stylesheet" href="_set.css" />
</head>
<body>
  <div class="win">
    <div class="titlebar"><div class="lights" aria-hidden="true"><i class="r"></i><i class="y"></i><i class="g"></i></div><b>图译</b><span></span></div>
    <header class="tb"><button type="button" class="tbtn">返回</button><span class="grow"></span></header>
    <section class="set-page">
      <div class="set-h"><h1>设置</h1><p>拨完底下有一句人话，确认你选的是啥。</p></div>
      <div class="card wide">
        <h2>怎么译</h2>
        <div class="seg" id="eng">
          <button type="button" class="on">网上翻译</button>
          <button type="button">自己配接口</button>
        </div>
        <p class="cap" id="eng-cap">网上翻译：DeepL 或 Azure，把密钥贴进来。</p>
        <div class="field">密钥 <input type="password" placeholder="没有就空着" /></div>
      </div>
      <div class="card wide">
        <h2>写回图里</h2>
        <div class="seg" id="lay">
          <button type="button" class="on">只留译文</button>
          <button type="button">原文和译文都留</button>
        </div>
        <p class="cap" id="lay-cap">图上只看见译文，原文不留。</p>
      </div>
      <div class="grid">
        <div class="card">
          <h2>颜色</h2>
          <div class="seg">
            <button type="button">浅色</button>
            <button type="button" class="on">深色</button>
          </div>
        </div>
        <div class="card">
          <h2>词汇库</h2>
          <p class="help">固定怎么译的词。</p>
          <button type="button" class="tbtn">打开词汇库</button>
        </div>
        <div class="card">
          <h2>更新</h2>
          <button type="button" class="tbtn">检查更新</button>
        </div>
        <div class="card">
          <details>
            <summary style="cursor:pointer;font-weight:650;padding:8px 0">少用的</summary>
            <label class="row"><input type="checkbox" /> 不联网</label>
            <label class="row"><input type="checkbox" checked /> 数字、尺寸先别译</label>
          </details>
        </div>
      </div>
    </section>
    <footer class="foot"><span class="live">ODA 已装</span></footer>
  </div>
  <script>
    function bind(id, cap, map) {
      const box = document.getElementById(id);
      box.onclick = function (e) {
        const btn = e.target.closest("button");
        if (!btn) return;
        [...box.querySelectorAll("button")].forEach((b) => b.classList.toggle("on", b === btn));
        document.getElementById(cap).textContent = map[btn.textContent];
      };
    }
    bind("eng", "eng-cap", {
      "网上翻译": "网上翻译：DeepL 或 Azure，把密钥贴进来。",
      "自己配接口": "自己配接口：填网址和密钥，比如 DeepSeek。"
    });
    bind("lay", "lay-cap", {
      "只留译文": "图上只看见译文，原文不留。",
      "原文和译文都留": "原文、译文都写在图上。"
    });
  </script>
</body>
</html>
